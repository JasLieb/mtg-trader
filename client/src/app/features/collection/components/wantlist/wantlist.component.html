<div class="wantlist-container">
  <app-card-searcher
    (cardFound)="addCardToWantlist($event)"
  ></app-card-searcher>

  <app-collection-card-list
    [cards]="wantlist()?.cards ?? []"
    (cardDeleted)="deleteCard($event)"
    (cardUpdated)="updateCardSet($event)"
  ></app-collection-card-list>
</div>
